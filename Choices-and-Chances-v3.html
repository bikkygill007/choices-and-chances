<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Choices &amp; Chances</title>
    <style>
      :root {
        --bg: #f5faf9;
        --card: #fff;
        --tx: #203c43;
        --mu: #576e75;
        --ln: #dce9e8;
        --h: #e56969;
        --m: #9563d5;
        --w: #4296dc;
        --e: #16a79a;
        --s: #65a54c;
        --ac: #087f78;
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(ellipse at 0 0, #ddf8ed 0, transparent 45%),
          radial-gradient(ellipse at 100% 15%, #fff0dc 0, transparent 38%),
          var(--bg);
        color: var(--tx);
        font:
          16px/1.65 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        min-height: 100vh;
      }
      button,
      select {
        font: inherit;
      }
      button {
        touch-action: manipulation;
      }
      #app {
        max-width: 1120px;
        margin: auto;
        padding: 28px 32px 64px;
      }
      h1,
      h2,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.1;
        letter-spacing: -0.045em;
        margin-bottom: 20px;
      }
      h2 {
        font-size: 1.3rem;
        line-height: 1.35;
        letter-spacing: -0.025em;
        margin: 0 0 12px;
      }
      .sub,
      .note {
        color: var(--mu);
        font-size: 0.88rem;
        line-height: 1.65;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--ln);
        border-radius: 24px;
        padding: 28px;
        margin: 22px 0;
        box-shadow: 0 8px 32px #194e4810;
      }
      .card .card {
        box-shadow: none;
        background: #f6fbfa;
        border-radius: 16px;
        padding: 20px;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: var(--ac);
        color: white;
        padding: 12px 20px;
        font-size: 0.9rem;
        font-weight: 650;
        cursor: pointer;
        margin: 14px 8px 4px 0;
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          background 0.18s;
      }
      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px #087f7826;
        background: #066b65;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #e2a929;
        outline-offset: 4px;
      }
      button.o {
        display: block;
        position: relative;
        width: 100%;
        text-align: left;
        padding: 18px 20px;
        background: #fff;
        color: var(--tx);
        border: 1px solid var(--ln);
        margin: 10px 0;
        font-weight: 400;
      }
      button.o b {
        font-size: 0.96rem;
      }
      button.o:hover:not(:disabled) {
        background: #f0fbf7;
        border-color: #47b8a7;
      }
      button.o:disabled {
        background: #f5f6f7;
        color: #687980;
        cursor: not-allowed;
        border-style: dashed;
      }
      button.o:disabled .note {
        color: #6e7c80;
      }
      button.g {
        background: white;
        color: var(--ac);
        border: 1px solid #89c9bf;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .grid button.o {
        margin: 0;
        padding: 22px 20px 20px;
        min-height: 166px;
        border-top: 3px solid var(--profile, #79bfb1);
        background: linear-gradient(145deg, var(--wash, #effaf5), white 80%);
      }
      .grid button.o::before {
        content: attr(data-initial);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: var(--wash, #effaf5);
        color: var(--profile, #087f78);
        font-size: 0.95rem;
        font-weight: 800;
        margin-bottom: 14px;
      }
      .grid button.o::after {
        content: "↗";
        position: absolute;
        right: 19px;
        top: 22px;
        color: var(--profile, #087f78);
        font-size: 1.25rem;
      }
      .grid button.o b {
        font-size: 1.12rem;
      }
      .grid button.o .note {
        font-size: 0.8rem;
      }
      .grid #rnd {
        grid-column: 1/-1;
        min-height: 0;
        padding: 16px 20px 16px 76px;
        background: #f8fafc;
        border: 1px dashed #b5cacc;
      }
      .grid #rnd::before {
        position: absolute;
        left: 20px;
        top: 16px;
        margin: 0;
      }
      .grid #rnd::after {
        top: 20px;
      }
      .form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
        font-size: 0.82rem;
        font-weight: 650;
      }
      .form label {
        min-width: 0;
      }
      select {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #cbdedd;
        background: #fbfefd;
        color: var(--tx);
        font-size: 0.9rem;
        min-height: 46px;
      }
      #cw {
        display: inline-block;
        max-width: 100%;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 0.81rem;
        margin: 12px 0;
      }
      .bar b {
        width: 160px;
        font-weight: 550;
        flex-shrink: 0;
      }
      .trk {
        flex: 1;
        min-width: 0;
        height: 10px;
        background: #edf2f3;
        border-radius: 20px;
        overflow: hidden;
      }
      .fil {
        height: 100%;
        border-radius: 20px;
        transition: width 0.6s;
      }
      .num {
        width: 30px;
        text-align: right;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .tl {
        display: flex;
        gap: 8px;
        margin-top: 25px;
      }
      .tl i {
        flex: 1;
        height: 5px;
        border-radius: 6px;
        background: var(--ln);
      }
      .tl i.on {
        background: var(--ac);
      }
      .ev {
        border-left: 3px solid #73c5b2;
        border-radius: 0 14px 14px 0;
        background: #f3faf7;
        padding: 16px 20px;
        margin: 16px 0;
        font-size: 0.9rem;
      }
      .ev b {
        font-size: 1rem;
      }
      .chip {
        display: inline-block;
        font-size: 0.72rem;
        border: 1px solid #d6e8e3;
        background: white;
        border-radius: 7px;
        padding: 3px 8px;
        margin: 8px 5px 3px 0;
        font-variant-numeric: tabular-nums;
      }
      .tag {
        display: inline-block;
        color: var(--ac);
        font-size: 0.72rem;
        font-weight: 750;
        margin: 6px;
      }
      .scroll {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        padding: 13px 12px;
        border-bottom: 1px solid var(--ln);
        text-align: right;
      }
      th {
        background: #eff8f5;
        color: var(--ac);
        font-size: 0.76rem;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      tr:last-child td {
        border: 0;
      }
      svg {
        max-width: 100%;
        height: auto;
      }
      details {
        font-size: 0.85rem;
        color: var(--mu);
        padding: 18px 22px;
        border: 1px solid var(--ln);
        border-radius: 16px;
        background: #ffffffa8;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--tx);
      }
      details p {
        margin: 14px 0 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
        font-weight: 750;
        margin-bottom: 32px;
        letter-spacing: -0.01em;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        background: var(--ac);
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        font-size: 20px;
      }
      .brand small {
        margin-left: auto;
        color: var(--mu);
        font-size: 0.7rem;
        font-weight: 500;
      }
      .hero {
        position: relative;
        overflow: hidden;
        padding: 42px;
        border: 1px solid #d1e9e0;
        border-radius: 28px;
        background: linear-gradient(
          115deg,
          #e0f7ed 0%,
          #f0f9e9 58%,
          #fff0d6 100%
        );
        margin-bottom: 28px;
      }
      .hero::after {
        content: "";
        position: absolute;
        width: 270px;
        height: 270px;
        border: 36px solid #ffffff60;
        outline: 25px solid #ffffff30;
        border-radius: 50%;
        right: -105px;
        top: -105px;
        pointer-events: none;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: #34736a;
        font-weight: 750;
        font-size: 0.7rem;
        margin-bottom: 16px;
      }
      .hero h1 {
        max-width: 750px;
        position: relative;
        z-index: 1;
      }
      .hero h1 em {
        font-style: normal;
        color: var(--ac);
      }
      .hero p {
        max-width: 620px;
        color: #476a65;
        font-size: 0.98rem;
        margin-bottom: 26px;
      }
      .journey {
        display: flex;
        gap: 8px;
        position: relative;
        z-index: 1;
      }
      .journey span {
        flex: 1;
        border-top: 2px solid #91c9b5;
        padding-top: 9px;
        font-size: 0.7rem;
        font-weight: 650;
        color: #35695e;
      }
      .journey b {
        display: block;
        font-size: 0.88rem;
        margin-bottom: 2px;
      }
      .section-label {
        display: inline-block;
        color: var(--ac);
        background: #e9f7f1;
        border-radius: 7px;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        padding: 3px 8px;
        margin-bottom: 10px;
        font-weight: 750;
      }
      .game-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 12px;
      }
      .game-header .brand {
        margin: 0;
      }
      .game-header .note {
        font-size: 0.75rem;
      }
      .card:has(> .bar) {
        border-top: 4px solid #57bca7;
      }
      .card:has(> .bar) .bar:nth-child(6) {
        border-top: 1px solid var(--ln);
        padding-top: 18px;
        margin-top: 18px;
      }
      .card > h2:not(:first-child) {
        margin-top: 28px;
      }
      .footer {
        text-align: center;
        font-size: 0.72rem;
        color: var(--mu);
        padding: 24px 0 0;
      }
      @media (min-width: 850px) {
        .home-layout {
          display: grid;
          grid-template-columns: 1.1fr 1fr;
          gap: 22px;
        }
        .home-layout > .card {
          margin: 0 0 22px;
        }
        .home-layout .form {
          grid-template-columns: 1fr 1fr;
        }
        .home-layout #cmo:not(:empty) {
          grid-column: 1/-1;
        }
      }
      @media (max-width: 650px) {
        #app {
          padding: 20px 16px 36px;
        }
        .brand {
          margin-bottom: 20px;
        }
        .brand small {
          font-size: 0.6rem;
        }
        .hero {
          padding: 28px 23px;
          border-radius: 22px;
        }
        .hero p {
          font-size: 0.88rem;
        }
        .journey {
          flex-wrap: wrap;
          gap: 12px;
        }
        .journey span {
          min-width: 27%;
          flex-grow: 1;
        }
        .card {
          padding: 21px 18px;
          border-radius: 20px;
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }
        .grid button.o {
          padding: 16px 13px;
          min-height: 183px;
        }
        .grid button.o::after {
          right: 13px;
          top: 17px;
        }
        .bar {
          gap: 9px;
          font-size: 0.7rem;
        }
        .bar b {
          width: 125px;
        }
        .form {
          gap: 12px;
        }
        .game-header .note {
          display: none;
        }
        th,
        td {
          padding: 10px 8px;
          font-size: 0.75rem;
        }
        .ev {
          padding: 14px;
        }
        button {
          max-width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
      .education {
        border: 0;
        padding: 0;
        margin: 20px 0 0;
        min-width: 0;
      }
      .education legend {
        font-size: 0.82rem;
        font-weight: 650;
        margin-bottom: 9px;
      }
      .education-options {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .education-options label {
        position: relative;
        cursor: pointer;
      }
      .education-options input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .education-options span {
        display: block;
        border: 1px solid #cbdedd;
        border-radius: 9px;
        padding: 8px 11px;
        font-size: 0.76rem;
        background: #fbfefd;
        transition: background 0.15s;
      }
      .education-options input:checked + span {
        background: #087f78;
        color: white;
        border-color: #087f78;
        box-shadow: 0 3px 9px #087f7820;
      }
      .education-options input:focus-visible + span {
        outline: 3px solid #e2a929;
        outline-offset: 3px;
      }
      .education .note {
        font-size: 0.76rem;
        margin: 9px 0 0;
      }
      .chart-scroll {
        overflow-x: auto;
        margin: 16px 0 8px;
        border: 1px solid var(--ln);
        border-radius: 16px;
        background: #fff;
      }
      .result-chart {
        display: block;
        width: 100%;
        min-width: 560px;
        height: auto;
      }
      .legend-line {
        display: inline-block;
        width: 24px;
        height: 0;
        border-top: 3px solid #087f78;
        vertical-align: middle;
        margin: 0 7px 0 3px;
      }
      .legend-line.red {
        border-color: #c94b4b;
        border-top-style: dashed;
        margin-left: 16px;
      }
      .legend-box {
        display: inline-block;
        width: 12px;
        height: 12px;
        background: #087f78;
        vertical-align: middle;
        margin: 0 7px 0 3px;
      }
      .kd {
        display: inline-block;
        font-size: 0.66rem;
        font-weight: 750;
        letter-spacing: 0.04em;
        border-radius: 6px;
        padding: 2px 7px;
        margin-right: 7px;
        vertical-align: 1px;
        white-space: nowrap;
      }
      .k-S {
        background: #e3f4e0;
        color: #2d6a1f;
        border: 1px solid #b6dcae;
      }
      .k-C {
        background: #e1f0fa;
        color: #1d5f8a;
        border: 1px solid #b2d4ea;
      }
      .k-X {
        background: #fff3d6;
        color: #8a5a00;
        border: 1px solid #ecd49a;
      }
      .k-I {
        background: #f1e9f8;
        color: #6b3f8f;
        border: 1px solid #d6c4e6;
      }
      .evl {
        display: block;
        margin-top: 10px;
        font-size: 0.78rem;
        color: var(--mu);
        line-height: 1.55;
        border-top: 1px dashed #cfe3dd;
        padding-top: 8px;
      }
      .opt {
        margin: 0 0 4px;
      }
      .evd {
        margin: -4px 0 12px;
        padding: 10px 16px;
        border-radius: 12px;
        background: #fbfefd;
      }
      .evd p {
        margin: 8px 0 0;
      }
      .evd summary {
        font-size: 0.78rem;
      }
      fieldset {
        min-width: 0;
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .nav .brand {
        margin: 0;
      }
      .nav .links button {
        margin: 0 0 0 8px;
        padding: 8px 14px;
        font-size: 0.8rem;
      }
      .two {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .two .card {
        margin: 0;
      }
      .form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 14px;
        margin: 10px 0 4px;
      }
      .form label {
        font-size: 0.78rem;
        font-weight: 650;
        color: var(--mu);
        display: block;
      }
      .form select {
        width: 100%;
        margin-top: 4px;
        padding: 9px 10px;
        border: 1px solid var(--ln);
        border-radius: 10px;
        background: #fff;
        color: var(--tx);
      }
      .pill {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-size: 0.9rem;
        margin: 8px 18px 0 0;
      }
      .pill input {
        width: 18px;
        height: 18px;
        accent-color: var(--ac);
      }
      .who {
        font-weight: 750;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .who i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--pc);
      }
      .steps {
        display: flex;
        gap: 6px;
        margin: 6px 0 4px;
      }
      .steps div {
        flex: 1;
        text-align: center;
        font-size: 0.72rem;
        color: var(--mu);
        border-top: 4px solid var(--ln);
        padding-top: 6px;
      }
      .steps .done {
        border-color: var(--ac);
        color: var(--tx);
      }
      .steps .now {
        border-color: var(--ac);
        color: var(--ac);
        font-weight: 750;
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(var(--n), minmax(0, 1fr));
        gap: 18px;
        align-items: start;
      }
      .cols > .card {
        margin: 0;
      }
      .pcard {
        border-top: 5px solid var(--pc);
      }
      .pcard h2 {
        margin-bottom: 4px;
      }
      .sc {
        display: grid;
        grid-template-columns: 78px 1fr 34px 62px;
        gap: 10px;
        align-items: center;
        margin: 9px 0;
        font-size: 0.9rem;
      }
      .sc b {
        font-weight: 650;
      }
      .trk {
        position: relative;
        height: 12px;
        border-radius: 7px;
        background: #e8f0ef;
        overflow: visible;
      }
      .trk i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-radius: 7px;
        transition: width 0.5s;
      }
      .trk u {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        background: #9fb5b3;
        border-radius: 1px;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .st {
        font-style: normal;
        font-size: 0.68rem;
        font-weight: 750;
        border-radius: 6px;
        padding: 2px 7px;
        text-align: center;
      }
      .st-Low {
        background: #fde8e8;
        color: #a63a3a;
      }
      .st-Middle {
        background: #fff3d6;
        color: #8a5a00;
      }
      .st-High {
        background: #e3f4e0;
        color: #2d6a1f;
      }
      .legend {
        font-size: 0.74rem;
        color: var(--mu);
        margin: 2px 0 10px;
      }
      .optw {
        margin: 10px 0;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        background: #fff;
        color: var(--tx);
        border: 1px solid var(--ln);
        border-radius: 14px;
        padding: 14px 16px;
        margin: 0;
        font-weight: 400;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .opt:hover:not(:disabled) {
        background: #f0fbf7;
        border-color: #47b8a7;
        transform: none;
        box-shadow: none;
      }
      .opt.sel {
        border: 2px solid var(--pc);
        background: #f0fbf7;
        padding: 13px 15px;
      }
      .opt:disabled {
        background: #f5f6f7;
        color: #687980;
        border-style: dashed;
        cursor: not-allowed;
      }
      .opt b {
        font-size: 0.95rem;
      }
      .opt .d {
        display: block;
        color: var(--mu);
        font-size: 0.84rem;
        margin-top: 2px;
      }
      .opt .lock {
        display: block;
        color: #8a6a1f;
        font-size: 0.8rem;
        margin-top: 4px;
      }

      /* flip cards */
      .card3d {
        display: block;
        width: 100%;
        margin: 6px 0 12px;
        padding: 0;
        background: none;
        border: 0;
        perspective: 900px;
        cursor: pointer;
        text-align: center;
        color: var(--tx);
        font-weight: 400;
      }
      .card3d:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: none;
        background: none;
      }
      .face {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 132px;
        border-radius: 18px;
        padding: 16px;
        border: 2px solid var(--pc, #087f78);
      }
      .face.back {
        background: repeating-linear-gradient(
          45deg,
          #087f78 0 12px,
          #0a8f87 12px 24px
        );
        color: #fff;
        border-color: #066b65;
        box-shadow: 0 6px 16px #087f7833;
      }
      .face.back b {
        font-size: 1.05rem;
      }
      .face.back small {
        opacity: 0.85;

      .big2 {
        font-size: 2rem;
        line-height: 1;
      }
      .face.front {
        background: #fffdf5;
        border-color: #e2a929;
        cursor: default;
      }
      .face.front.good {
        background: #f3fbef;
        border-color: #65a54c;
      }
      .face.front.bad {
        background: #fdf1f1;
        border-color: #d9534f;
      }
      .face.front.quiet {
        background: #f4f7f8;
        border-color: #b9c6c9;
      }
      .face.front small {
        color: var(--mu);
        font-size: 0.82rem;
      }
      .face.front .fx {
        justify-content: center;
      }
      .card3d.open {
        cursor: default;
      }
      .flipin .face {
        animation: flip 0.7s ease;
      }
      @keyframes flip {
        0% {
          transform: rotateY(90deg) scale(0.9);
          opacity: 0.2;
        }
        100% {
          transform: rotateY(0) scale(1);
          opacity: 1;
        }
      }

          background 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease,
          transform 0.18s ease;
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      .setup-tabs button:focus-visible {
        outline: 3px solid #baa0df;
        outline-offset: 3px;

      }
      .two > .card:nth-child(2) {
        animation-delay: 0.07s;
      }
      .res {
        animation: page-arrive 0.3s ease both;
      }
      .shared-events {
        animation: page-arrive 0.35s ease both;
      }
      .flipin .face,
      .event-flipin {
        animation: card-reveal 0.48s cubic-bezier(0.2, 0.7, 0.3, 1) both;
        transform-origin: center center;
        backface-visibility: hidden;
      }
      .meter-changing {
        animation: meter-update 0.55s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      .opt.sel .choice-radio {
        animation: selection-pop 0.2s ease;
      }
      @keyframes page-arrive {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes card-reveal {
        from {
          opacity: 0.3;
          transform: perspective(900px) rotateY(-85deg);
        }
        to {
          opacity: 1;
          transform: perspective(900px) rotateY(0);
        }
      }
      @keyframes meter-update {
        from {
          width: var(--meter-from);
        }
      }
      @keyframes selection-pop {
        from {
          transform: scale(0.8);
        }
        to {
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

 <p><b>A life in stages.</b> You start as a young adult and move through five stages of life. At the start of each stage the game draws what your life looks like at that point: work, household, mood, life satisfaction, difficulty with daily tasks, weight, long-term illness, insurance and the chance of a hospital stay. The draw depends on who you are: your age, sex, where you live, your marital status, your schooling, your spending rank and your work. Much of it carries over from the stage before: your job, marital status, household, insurance and schooling stay as they were unless you change them or something happens to you.</p>
 <p><b>Bars.</b> Each bar shows where you stand among people at the same stage of life: the share who are worse off than you, plus half of those level with you. The middle of the bar is average. Mental wellbeing drops while someone is in a low mood or caring for a parent (game rules). Because a bar is a position among peers, a small change can move it a long way, and it is not a measure of how you feel.</p>
 <p><b>Years, events and chance.</b> Each year can bring death, the loss of a spouse or a hospital stay. A hospital bill is spread over several years of household spending, so it can push you down the spending ranking; insurance reduces it. At the start of a stage, chance can also bring a windfall, hard times for everyone of your age, a parent who needs care, the loss of a job you chose, or the end of a marriage. Random events, including the extra chance cards, can be switched off on the home page; with them off, no luck events happen and only the survey-based model is running. In a duel, hard times hit both lives.</p>
 <p><b>Decisions.</b> A decision never changes a bar directly. It changes something underneath, such as work, household, insurance or spending, and the bars then follow. Options fit your situation: a formal job can be left only by retiring or losing it, remarriage opens only after widowhood or separation, and a hobby or an old-age club opens at sixty. Closed options say why. You can combine up to three options in a stage, one of each kind; options that cannot be done together turn grey and say why.</p>
 <p><b>Cards and totals.</b> When you flip a card, the bars move by that card's change. If two changes happen together, how the total is split between the cards depends on the order we show them; the total after the last card never depends on the order.</p>
 <p><b>Labels.</b> Cards and options carry a label. <i>Survey data</i> means the size of the effect comes from real-world data. <i>Game rule</i> means we set it ourselves, so that choices and luck can matter in the game; these are not findings.</p>
 <p><b>What to keep in mind.</b> This is an illustration, not a forecast. The data show patterns from one period of time, so they point to associations, not causes. Older players in the game are today's young adults, so they can look healthier than the older people in the surveys. Some patterns for younger ages are extensions of older-age patterns, and some health costs measured in later life are used at every age, so they are probably too high for the young. Decision effects, event sizes and chance cards are game rules.</p></details></div>`;

          lk.push([
            dvc.age,
            `Your marriage ended in your ${stn(dvc)} stage, and your household was redrawn from the tables for separated people.`,
          ]);
        if (rem)
          lk.push([rem.age, `You married again in your ${stn(rem)} stage.`]);
        if (pc.length)
          lk.push([
            pc[0].age,
            `In your ${stn(pc[0])} stage a parent needed care and the work fell on you, with a temporary dent to your Mental wellbeing.`,
          ]);
        if (mar)
          lk.push([
            0,
            "You married, which changed the household you were drawn into.",
          ]);
        if (lk.length)
          out.push([
            "Other people’s lives",
            "Linked lives",
            lk
              .sort((a, b) => a[0] - b[0])
              .map((x) => x[1])
              .join(" "),
            "We do not age alone. Relationships open and close possibilities, and the costs of other people’s lives land on us.",
          ]);
        if (p.sex === "F" && (wid || p.alive || p.deathAge >= 60)) {
          const lower = T && T.sex && T.sex[3] && T.sex[3].F < T.sex[3].M;
          out.push([
            "Women in old age",
            "Feminisation of ageing",
            `${wid ? "You were a woman widowed in your " + stn(wid) + " stage." : "You are a woman who lived into old age."} In LASI, far more women than men are widowed in old age.${T && T.sex ? ` In the simulated lives, women’s Social support bar ended ${lower ? "lower" : "higher"} than men’s in old age.` : ""}`,
            "Women outlive men and are far more often widowed, so old age is a gendered experience.",
          ]);
        }
        const dl = p.decisionsMade.map(
          (d) =>
            E.OPTIONS.find((o) => o.id === d.id).label +
            " (" +
            ST[d.stage].name.toLowerCase() +
            ")",
        );
        out.push([
          "Your decisions",
          "Agency within structure",
          dl.length
            ? `You made decisions along the way: ${dl.join("; ")}. Some options were closed to you, such as ${closedExample(pl)}.`
            : `You made no decisions, so this life came from where you started and from chance. Some options were closed to you anyway, such as ${closedExample(pl)}.`,
          "People make real choices, but within structures: do not blame individuals entirely, and do not deny their agency.",
        ]);
        const le = lifeExpectancy(p),
          pm = pooledLE();
        if (Math.abs(le - pm) >= 2)
          out.push([
            "Where you lived",
            "Levels of analysis: micro, meso, macro",
            `Death rates differ by place and sex. From SRS tables, ${p.sex === "F" ? "women" : "men"} in ${p.res === "Rural" ? "rural" : "urban"} ${p.state} are expected to live ${le < pm ? "fewer" : "more"} years than the average across the states in the game. ${p.alive ? "You reached the oldest age the game covers." : "Your life ended before the oldest age the game covers."}`,
            "Ageing is shaped at several levels at once: your own decisions, your household and work, and the death rates of the place you live.",
          ]);
        for (const t of ["Where you lived", "Hard times", "Hospital bill"])
          if (out.length > 5) {
            const i = out.findIndex((c) => c[0] === t);
            if (i > 0) out.splice(i, 1);
          }
        return out.slice(0, 5);
      }
      function playerView(pl) {
        const p = pl.p,
          b = lastBars(p),
          startQ = quintileAtStart(pl);
        return `<div class="card" style="border-top:5px solid ${pl.col}"><h1 style="font-size:clamp(1.6rem,4vw,2.4rem)">${p.alive ? "You reached age 85" : "Your life ended at about age " + p.deathAge}</h1><div class="sub">${esc(dispName(pl))} · ${bgText(p)} · started in the ${FIFTH[startQ].toLowerCase()} by household spending</div>
 <h3 style="margin:16px 0 4px;font-size:1rem">Final bars: better off than this share of people at the same stage</h3>${BAR.map(
   (k) => {
     const v = b[k[0]],
       d = v - pl.startBars[k[0]];
     return `<div class="barrow"><b>${k[1]}</b><div class="trk"><i style="width:${v}%;background:${k[2]}"></i></div><span class="num">${pct(v)}</span><span class="delta ${d >= 1 ? "up" : d <= -1 ? "dn" : ""}">${Math.abs(d) >= 1 ? (d > 0 ? "+" : "−") + Math.round(Math.abs(d)) : ""}</span></div>`;
   },
 ).join(
   "",
 )}<p class="note">Change is measured from your bars at age 18. 50 is average.</p>
 <h3 style="margin:16px 0 4px;font-size:1rem">Your bars across the life</h3><div class="chart-scroll">${lifeChart(p)}</div><p class="note">Vertical jumps happen where a new stage begins: your work, household, mood and health are redrawn from the tables for your new age.</p>
 <h3 style="margin:16px 0 4px;font-size:1rem">What happened in this life, and the course idea behind it</h3>${lifeLinks(
   pl,
 )
   .map(
     (c) =>
       `<div class="cc"><span class="m">${c[0]}</span><b>${c[1]}</b><div class="in">In this life: ${c[2]}</div><div class="id">Course idea: ${c[3]}</div></div>`,
   )
   .join("")}
 <button data-replay="${pl.i}">How much of this was chance</button><div id="o-rep${pl.i}"></div></div><button id="again">${G.np === 1 ? "Live another life" : "Play again"}</button>`;
      }
      // function physNote(p) {
      //   const q = E.barParts(p, p.stage),
      //     f = (v) => Math.round(v);
      //   return `<details class="box"><summary>What is inside the Physical health bar?</summary><p>It is the average of three parts, each scored the same way as the other bars: daily-activity difficulty <b>${f(q.adl)}</b>, being underweight <b>${f(q.uw)}</b>, and number of diagnosed long-term conditions <b>${f(q.multi)}</b>.</p><p>The parts can pull in different directions. Across 10,000 simulated lives, richer people were less often underweight and had less difficulty with daily tasks, but more often had two or more diagnosed conditions. LASI counts conditions a doctor has ever diagnosed, and its report notes that such self-reports depend on access to health care and can hide undiagnosed illness. So a poorer person can have fewer diagnoses and still be sicker. This is why the bar looks flat across wealth.</p></details>`;
      // }
      function duel() {
        const [A, B] = G.players,
          a = lastBars(A.p),
          b = lastBars(B.p),
          keys = BAR.map((k) => [k[0], k[1]]);
        const dumb = BAR.map((k) => {
          const x = a[k[0]],
            y = b[k[0]],
            d = Math.round(x - y);
          return `<div class="db"><b>${k[1]}</b><div class="dtrk"><span class="seg" style="left:${Math.min(x, y)}%;width:${Math.abs(x - y)}%"></span><i style="left:${x}%;background:${PC[0]}">A</i><i style="left:${y}%;background:${PC[1]}">B</i></div><span class="dn">${Math.abs(d) < 3 ? "about the same" : (d > 0 ? "A" : "B") + " sits higher"}</span></div>`;
        }).join("");
        const at = (P, i) => {
          const d = P.p.decisionsMade
              .filter((x) => x.stage === i)
              .map((x) => E.OPTIONS.find((o) => o.id === x.id).label),
            c = P.p.log
              .filter((e) => e.kind === "chance" && e.stage === i)
              .map((e) => "Card: " + e.title);
          return d.concat(c).join("; ") || "no decision";
        };
        let split = -1,
          best = -1;
        const nA = A.p.hist.filter((h) => h.point === "end"),
          nB = B.p.hist.filter((h) => h.point === "end"),
          n = Math.min(nA.length, nB.length);
        for (let i = 0; i < n; i++) {
          const d = keys.reduce(
            (t, [k]) => t + Math.abs(nA[i].bars[k] - nB[i].bars[k]),
            0,
          );
          if (d > best) {
            best = d;
            split = i;
          }
        }
        const rows = Array.from({ length: 5 }, (_, i) => {
          const sa = nA[i]
              ? at(A, i)
              : '<span class="note">life had ended</span>',
            sb = nB[i] ? at(B, i) : '<span class="note">life had ended</span>';
          return `<tr class="${i === split ? "hl" : ""}"><td>${ST[i].name}</td><td>${sa}</td><td>${sb}</td></tr>`;
        }).join("");
        const ageTxt = (P) =>
          P.p.alive ? "reached 85" : "ended at about " + P.p.deathAge;
        return `<h1 style="font-size:clamp(1.6rem,4vw,2.4rem)">Two paths ${G.same ? "from the same start" : "from different starts"}</h1><div class="vs"><p><b style="color:${PC[0]}">${esc(dispName(A))}</b> ${ageTxt(A)}. <b style="color:${PC[1]}">${esc(dispName(B))}</b> ${ageTxt(B)}. ${G.same ? "They began in exactly the same position, so what differs is the choices they made and the luck that fell their way." : "They began from different positions, so the comparison shows how start, choices and luck combine."}</p></div>
 <div class="card"><h2>Where each life ended, side by side</h2><div class="dbs">${dumb}</div><p class="note">Both lives are finished before they are compared. A higher bar is a better position among people of the same age, not a better life, and no one wins: the point is how two starts and two sets of luck unfold.</p></div>
 <div class="card"><h2>The paths over time</h2><div class="minis">${BAR.map((k) => miniChart(A, B, k)).join("")}</div><p class="note"><span style="color:${PC[0]}">●</span> ${esc(dispName(A))} &nbsp; <span style="color:${PC[1]}">●</span> ${esc(dispName(B))}. Points are the start and the end of each stage.</p></div>
 <div class="card"><h2>Where the paths moved apart</h2>${split < 0 ? "" : `<p>The two paths were furthest apart after <b>${ST[split].name}</b>.</p>`}<div class="scroll"><table class="t"><tr><th>Stage</th><th style="color:${PC[0]}">${esc(dispName(A))}</th><th style="color:${PC[1]}">${esc(dispName(B))}</th></tr>${rows}</table></div></div>
 <div class="card"><h2>Questions for the class</h2><p class="note">How much of the gap comes from where each life started, how much from the choices, and how much from chance? Which choice would you have made differently, and what would it have cost you somewhere else? Is a higher bar on every line the same as a better life? Open each player's summary above for the course ideas their life triggered.</p></div><button id="again">Play again</button>`;
      }

      function lifeExpectancy(p) {
        const q = MODEL._q0[p.state + "|" + p.res + "|" + p.sex];
        let S = 1,
          t = 0;
        for (let a = 18; a < 105; a++) {
          const h = q[Math.min(a, q.length - 1)];
          t += S * (1 - h / 2);
          S *= 1 - h;
        }
        return t;
      }
      function quintileAtStart(pl) {
        const r = E.pooledRank(pl.start.x0);
        return Math.min(4, Math.floor(r * 5));
      }
      function closedExample(pl) {
        const cl = (pl.menu || []).filter((x) => !x.ok),
          m = cl.find((x) => !/already|highest/i.test(x.why)) || cl[0];
        return m
          ? `"${m.label}" (${m.why.replace(/\.$/, "").toLowerCase()})`
          : "options available only to people with different resources";
      }
      let _ple = null;
      function pooledLE() {
        if (_ple) return _ple;
        let t = 0,
          w = 0;
        for (const k in MODEL.q0) {
          const [s, r, x] = k.split("|"),
            u = MODEL.urb_share[s] / 100,
            ww = MODEL.pop[s] * (r === "Urban" ? u : 1 - u);
          t += ww * lifeExpectancy({ state: s, res: r, sex: x });
          w += ww;
        }
        return (_ple = t / w);
      }
      /* ---------- replay: many lives from the same start ---------- */
      function play(p, rng, policy) {
        for (let s = 0; s < 5 && p.alive; s++) {
          E.beginStage(p, s, rng);
          if (G.cards) E.drawCard(p, rng);
          E.applyPicks(p, policy(p, s), rng);
          E.runStage(p, rng);
        }
        return p;
      }
      function mkFrom(st, rng) {
        const p = E.newPerson(
          { state: st.state, res: st.res, sex: st.sex, edu5: st.edu5 },
          rng,
        );
        p.x0 = st.x0;
        p.u0 = st.u0;
        return p;
      }
      function life(st, rng, policy) {
        return play(mkFrom(st, rng), rng, policy);
      }
      const randPolicy = (rr, cnt) => (p, s) =>
        E.randomPicks(p, rr, cnt[s]);
      function replay(pl) {
        const out = $("#o-rep" + pl.i);
        out.innerHTML = '<p class="note">Running 400 lives…</p>';
        setTimeout(() => {
          const N = 400,
            rr = E.rng((Math.random() * 4294967296) >>> 0),
            A = [],
            cnt = [0, 0, 0, 0, 0],
            lived = Math.max(1, pl.p.hist.filter((h) => h.point === "end").length);
          for (const d of pl.p.decisionsMade) cnt[d.stage]++;
          const avg = Math.round(cnt.slice(0, lived).reduce((a, b) => a + b, 0) / lived);
          for (let s = lived; s < 5; s++) cnt[s] = avg;
          for (let n = 0; n < N; n++)
            A.push(life(pl.start, rr, randPolicy(rr, cnt)));
          const me = lastBars(pl.p),
            reach = A.filter((p) => p.alive).length / N;
          const strip = ([k, l, c]) => {
            const v = A.map((p) => lastBars(p)[k]).sort((a, b) => a - b),
              q = (f) => v[Math.floor(f * (N - 1))],
              lo = q(0.1),
              hi = q(0.9),
              md = q(0.5);
            return `<div class="rs"><b>${l}</b><div class="rtrk" role="img" aria-label="${l}: where lives with your start ended, and where yours ended"><span class="band" style="left:${lo}%;width:${Math.max(hi - lo, 1.5)}%;background:${c}"></span><span class="med" style="left:${md}%"></span><i class="you" style="left:${me[k]}%;background:${c}"></i></div></div>`;
          };
          out.innerHTML = `<div class="card"><h2>How much of this was chance</h2><p class="note">A fresh set of lives that begin exactly like yours (${bgText(pl.p)}, same household spending), with chance deciding what happens and as many random decisions per stage as you made. In each strip the shaded band holds the middle of those lives, the thin line marks the typical one, and the dot is your life. Press the button again for a new set.</p>${BAR.map(strip).join("")}<div class="rs-axis"><span>worse off than most people your age</span><span>better off</span></div><p class="note">The wider the band, the more the same start can lead to very different lives. Your life ${pl.p.alive ? "reached" : "ended before"} the oldest age the game covers; among these lives ${reach >= 0.5 ? "most" : "fewer than half"} reached it.</p></div>`;
          out.scrollIntoView({ behavior: "smooth" });
        }, 40);
      }
      home();
    </script>
  </body>
</html>
